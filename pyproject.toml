[project]
name = "quant-data-pipeline"
version = "0.1.0"
description = "A data pipeline for quantitative finance"
authors = [
    { name = "Kalofaws"}
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pre-commit>=4.7.0",
    "pyarrow>=26.0.1",
    "tushare>=1.4.29",
]

[project.scripts]
quant-data-pipeline = "quant_data_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
