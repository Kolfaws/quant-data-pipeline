[project]
name = "data-pipeline"
version = "0.1.0"
description = "Quant Data Pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "polars",
    "duckdb",
    "tushare",
    "akshare",
    "loguru",
    "python-dotenv",
    "pydantic",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
